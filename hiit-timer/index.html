<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HIITタイマー | 毎日ツール集</title>
  <!-- 共通の見た目 → このツール専用の見た目 の順に読む（後の方が優先される） -->
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="style.css">
  <script src="../common/storage.js"></script>
  <script src="../common/theme.js"></script>
</head>
<!-- body の class をフェーズごとに入れ替えて背景色を変える -->
<body class="phase-idle">
  <header class="app-header">
    <a class="back-link" href="../index.html">← 一覧</a>
    <h1 class="app-title">HIITタイマー</h1>
    <button type="button" class="theme-toggle" data-theme-toggle>テーマ</button>
  </header>

  <main class="container">
    <!-- ===== タイマー表示 ===== -->
    <section class="timer">
      <!-- aria-live：読み上げソフトにフェーズの切り替わりを伝える -->
      <p class="phase-label" id="phaseLabel" aria-live="polite">スタンバイ</p>
      <!-- 今の種目名（休憩・準備中は「次の種目」）。種目が未登録なら空のまま -->
      <p class="exercise-name" id="exerciseName" aria-live="polite"></p>
      <p class="time" id="time">20</p>
      <p class="set-count" id="setCount">全 8 セット</p>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="next-info" id="nextInfo">&nbsp;</p>
    </section>

    <!-- ===== 操作ボタン ===== -->
    <div class="controls">
      <button type="button" class="btn btn-primary" id="startButton">開始</button>
      <button type="button" class="btn" id="resetButton">リセット</button>
    </div>
    <p class="wake-status" id="wakeStatus"></p>

    <!-- ===== 種目 ===== -->
    <section class="card exercises">
      <h2>種目</h2>
      <!-- タイマー中は fieldset ごと操作できなくする（設定と同じ仕組み） -->
      <fieldset id="exerciseFieldset">
        <ol class="exercise-list" id="exerciseList"></ol>

        <form class="exercise-add" id="exerciseAddForm" autocomplete="off">
          <input type="text" id="exerciseNameInput" maxlength="20" placeholder="種目名（例：バーピー）" aria-label="追加する種目名" required>
          <button type="submit" class="btn" id="exerciseAddButton">追加</button>
        </form>

        <p class="hint" id="exerciseHint"></p>
      </fieldset>
    </section>

    <!-- ===== 設定 ===== -->
    <section class="card settings">
      <h2>設定</h2>
      <!-- fieldset を disabled にすると、中の入力欄がまとめて操作不可になる -->
      <fieldset id="settingsFieldset">
        <div class="field-grid">
          <label class="field">
            <span>運動（秒）</span>
            <input type="number" id="workInput" inputmode="numeric" min="1" max="3600">
          </label>
          <label class="field">
            <span>休憩（秒）</span>
            <input type="number" id="restInput" inputmode="numeric" min="0" max="3600">
          </label>
          <label class="field">
            <span>セット数</span>
            <input type="number" id="setsInput" inputmode="numeric" min="1" max="99">
          </label>
          <label class="field">
            <span>準備（秒）</span>
            <input type="number" id="prepInput" inputmode="numeric" min="0" max="60">
          </label>
        </div>

        <div class="toggles">
          <label><input type="checkbox" id="soundCheck"> 音を鳴らす</label>
          <label><input type="checkbox" id="vibrateCheck"> <span id="vibrateLabel">バイブ</span></label>
        </div>

        <p class="total">合計時間：<strong id="totalTime">-</strong></p>
        <p class="hint">準備を 0 にすると、すぐ運動から始まります。PCではスペースキーで開始／一時停止できます。</p>
        <!-- 音声ファイルの作成には上限があるので、超えるときだけ知らせる（JavaScript で表示を切り替え） -->
        <p class="hint" id="soundNote" hidden>合計が60分を超えるため、画面ロック中は音が鳴りません（画面を開いている間は鳴ります）。</p>
      </fieldset>
    </section>
  </main>

  <!-- HTML を全部読み込んだ後に動かすため、スクリプトは最後に置く -->
  <script src="script.js"></script>
</body>
</html>
